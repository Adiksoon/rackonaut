<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rackonaut · Warehouse Digital Twin</title>
  <link rel="stylesheet" href="./viewer.css">
  <script type="importmap">
    {"imports":{"three":"../../../ros2_ws/src/rackonaut_control/web/vendor/three.module.min.js"}}
  </script>
  <script type="module" src="./viewer.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span aria-hidden="true">R</span> Rackonaut</a>
    <div class="archive-controls">
      <label for="archive">Calibration</label>
      <select id="archive">
        <option value="goal24">GOAL 24</option>
        <option value="goal26">GOAL 26</option>
        <option value="file" disabled>Local file</option>
      </select>
      <label class="open-file">Open reconstruction<input type="file" id="open" accept=".json,application/json"></label>
    </div>
  </header>
  <main>
    <header class="heading">
      <div><h1>Warehouse Digital Twin</h1><p id="archive-description">Loading calibration…</p></div>
      <div class="layers" role="group" aria-label="Scene layers">
        <button type="button" data-mode="enhanced" aria-pressed="true">Enhanced Digital Twin</button>
        <button type="button" data-mode="measured" aria-pressed="false">Measured Model</button>
        <button type="button" data-mode="cloud" aria-pressed="false">LiDAR Scan</button>
        <label class="toggle"><input type="checkbox" id="overlay"> Overlay LiDAR</label>
      </div>
    </header>
    <p id="error" role="alert" hidden></p>
    <div class="workspace">
      <section class="stage" id="stage" aria-label="Interactive warehouse view">
        <div id="viewport"></div>
        <div id="markers"></div>
        <div class="views" role="group" aria-label="Camera view">
          <div class="presets">
            <button type="button" data-view="isometric" aria-pressed="true">Iso</button>
            <button type="button" data-view="top" aria-pressed="false">Top</button>
            <button type="button" data-view="side" aria-pressed="false">Side</button>
          </div>
          <button type="button" id="fit">Fit racks</button>
          <button type="button" id="survey">Fit survey</button>
        </div>
        <div class="stage-notes"><span id="legend"></span><span id="view-help">Drag to orbit · Scroll to zoom</span></div>
      </section>
      <aside class="inspector">
        <section aria-labelledby="scene-title">
          <h2 id="scene-title">Survey context</h2>
          <p id="coverage"></p>
          <label class="toggle"><input type="checkbox" id="show-route"><span id="route-label">Recorded route</span></label>
        </section>
        <section aria-labelledby="locations-title">
          <h2 id="locations-title">Taught locations</h2>
          <div id="location-list" class="location-list"></div>
          <div id="location-detail" class="location-detail" hidden>
            <p id="location-explanation"></p>
            <img id="location-photo" alt="Camera image recorded during calibration" hidden>
          </div>
        </section>
        <details class="geometry">
          <summary>Geometry provenance</summary>
          <dl class="stats">
            <div><dt>LiDAR points</dt><dd id="point-count">—</dd></div>
            <div><dt>Rack rows</dt><dd id="row-count">—</dd></div>
          </dl>
          <p id="geometry-source"></p>
          <label class="toggle"><input type="checkbox" id="show-support"> Highlight measured rack fragments</label>
          <div id="rack-details"></div>
        </details>
      </aside>
    </div>
  </main>
</body>
</html>
